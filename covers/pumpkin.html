<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1080px;height:1080px;overflow:hidden;background:#FFF7DF}
.frame{position:absolute;inset:40px;border:24px solid #F2862A;border-radius:60px;box-sizing:border-box}
.wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
h1{margin:0;font-family:'Fredoka',sans-serif;font-weight:700;color:#3B2A5C;font-size:250px;line-height:1;white-space:nowrap}
</style></head><body>
<div class="frame"></div>
<div class="wrap"><h1 id="t">Pumpkin</h1></div>
<script>
document.fonts.ready.then(()=>{const t=document.getElementById('t');let s=250;while(t.scrollWidth<840&&s<400){s+=2;t.style.fontSize=s+'px';}while(t.scrollWidth>840){s-=2;t.style.fontSize=s+'px';}});
</script>
</body></html>
